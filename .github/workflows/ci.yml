name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: serba-matcha/package-lock.json

      - name: Install
        run: npm ci
        working-directory: serba-matcha

      - name: Lint
        run: npm run lint
        working-directory: serba-matcha

      - name: Test
        run: npm run test:ci
        working-directory: serba-matcha

      - name: Coverage
        run: npm run test:coverage
        working-directory: serba-matcha
